<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin — Pricing Ratio Config</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 20px;
      font-family: system-ui, -apple-system, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      display: flex;
      justify-content: center;
    }
    .card {
      width: 100%;
      max-width: 460px;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 20px;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }
    h1 {
      margin: 0;
      font-size: 1.2rem;
      color: #f8fafc;
    }
    a {
      color: #60a5fa;
      font-size: 0.85rem;
      text-decoration: none;
    }
    label {
      display: block;
      font-size: 0.85rem;
      color: #94a3b8;
      margin: 12px 0 6px;
    }
    input {
      width: 100%;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid #475569;
      background: #0f172a;
      color: #f8fafc;
      font-family: monospace;
      font-size: 0.95rem;
    }
    .row {
      display: flex;
      gap: 10px;
      margin-top: 16px;
    }
    button {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 8px;
      background: #3b82f6;
      color: #fff;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
    }
    button.secondary {
      background: #334155;
      flex: 0 0 auto;
      padding: 12px 16px;
    }
    button:hover { opacity: 0.92; }
    button:disabled { background: #475569; cursor: not-allowed; }
    pre {
      margin: 14px 0 0;
      padding: 12px;
      border-radius: 8px;
      background: #0f172a;
      border: 1px solid #334155;
      font-size: 0.8rem;
      overflow-x: auto;
      white-space: pre-wrap;
      display: none;
    }
    pre.ok { border-color: #22c55e; color: #86efac; display: block; }
    pre.err { border-color: #ef4444; color: #fca5a5; display: block; }
  </style>
</head>
<body>
  <div class="card">
    <div class="header">
      <h1>Pricing Config</h1>
      <a href="/admin">Sync &amp; Dump &rarr;</a>
    </div>

    <form id="pricingForm">
      <label for="adminKey">Admin Key</label>
      <input id="adminKey" type="password" required />

      <label for="ratio">USD_TO_INR_RATIO</label>
      <input id="ratio" type="number" step="0.001" min="0.001" required />

      <div class="row">
        <button type="button" class="secondary" id="loadBtn">Load Current</button>
        <button type="submit" id="saveBtn">Save Ratio</button>
      </div>
    </form>

    <pre id="output"></pre>
  </div>

  <script>
    const ratioEl = document.getElementById("ratio");
    const adminKeyEl = document.getElementById("adminKey");
    const outputEl = document.getElementById("output");
    const loadBtn = document.getElementById("loadBtn");
    const saveBtn = document.getElementById("saveBtn");

    loadBtn.addEventListener("click", async () => {
      outputEl.className = "";
      outputEl.style.display = "none";
      const key = adminKeyEl.value.trim();
      if (!key) {
        outputEl.textContent = "Enter Admin Key first.";
        outputEl.className = "err";
        return;
      }

      loadBtn.disabled = true;
      try {
        const res = await fetch("/api/v1/admin/pricing", {
          headers: { "x-admin-key": key },
        });
        const data = await res.json();
        if (!res.ok || !data.success) throw new Error(data.message || "Failed to load");
        ratioEl.value = data.data.usdToInrRatio;
        outputEl.textContent = "Loaded current ratio: " + data.data.usdToInrRatio;
        outputEl.className = "ok";
      } catch (err) {
        outputEl.textContent = err.message;
        outputEl.className = "err";
      } finally {
        loadBtn.disabled = false;
      }
    });

    document.getElementById("pricingForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      saveBtn.disabled = true;
      outputEl.className = "";
      outputEl.style.display = "none";

      try {
        const res = await fetch("/api/v1/admin/pricing", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "x-admin-key": adminKeyEl.value.trim(),
          },
          body: JSON.stringify({
            usdToInrRatio: parseFloat(ratioEl.value),
          }),
        });
        const data = await res.json();
        outputEl.textContent = JSON.stringify(data, null, 2);
        outputEl.className = res.ok && data.success ? "ok" : "err";
      } catch (err) {
        outputEl.textContent = "Request failed: " + err.message;
        outputEl.className = "err";
      } finally {
        saveBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
