<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin — Sync &amp; Dump</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 20px;
      font-family: system-ui, -apple-system, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      display: flex;
      justify-content: center;
    }
    .card {
      width: 100%;
      max-width: 520px;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 20px;
    }
    h1 {
      margin: 0 0 16px;
      font-size: 1.25rem;
      color: #f8fafc;
    }
    label {
      display: block;
      font-size: 0.85rem;
      color: #94a3b8;
      margin: 12px 0 6px;
    }
    input[type="password"],
    textarea {
      width: 100%;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid #475569;
      background: #0f172a;
      color: #f8fafc;
      font-family: monospace;
      font-size: 0.85rem;
    }
    textarea {
      resize: vertical;
      min-height: 72px;
    }
    .checks {
      display: flex;
      gap: 16px;
      margin: 14px 0;
      font-size: 0.9rem;
    }
    .checks label {
      display: flex;
      align-items: center;
      gap: 6px;
      margin: 0;
      color: #e2e8f0;
      cursor: pointer;
    }
    button {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      background: #3b82f6;
      color: #fff;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      margin-top: 6px;
    }
    button:hover { background: #2563eb; }
    button:disabled {
      background: #475569;
      cursor: not-allowed;
    }
    pre {
      margin: 16px 0 0;
      padding: 12px;
      border-radius: 8px;
      background: #0f172a;
      border: 1px solid #334155;
      font-size: 0.8rem;
      overflow-x: auto;
      white-space: pre-wrap;
      word-break: break-word;
      display: none;
    }
    pre.ok { border-color: #22c55e; color: #86efac; display: block; }
    pre.err { border-color: #ef4444; color: #fca5a5; display: block; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Sync &amp; Dump Control</h1>
    <form id="syncForm">
      <label for="adminKey">Admin Key</label>
      <input id="adminKey" type="password" required />

      <label for="auth">Authorization (Bearer ...)</label>
      <textarea id="auth" placeholder="Bearer eyJhbG... (leave empty to use .env)"></textarea>

      <label for="cookie">Cookie</label>
      <textarea id="cookie" placeholder="refreshToken=...; accessToken=... (leave empty to use .env)"></textarea>

      <div class="checks">
        <label><input id="runSync" type="checkbox" checked /> Run Sync Games</label>
        <label><input id="runDump" type="checkbox" checked /> Run Dump Details</label>
      </div>

      <button id="submitBtn" type="submit">Run Sync &amp; Dump</button>
    </form>

    <pre id="output"></pre>
  </div>

  <script>
    const form = document.getElementById("syncForm");
    const submitBtn = document.getElementById("submitBtn");
    const output = document.getElementById("output");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      submitBtn.disabled = true;
      submitBtn.textContent = "Running... please wait";
      output.className = "";
      output.style.display = "none";

      try {
        const body = {
          runSync: document.getElementById("runSync").checked,
          runDump: document.getElementById("runDump").checked,
        };
        const auth = document.getElementById("auth").value.trim();
        const cookie = document.getElementById("cookie").value.trim();
        if (auth) body.authorization = auth;
        if (cookie) body.cookie = cookie;

        const res = await fetch("/api/v1/admin/sync-dump", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "x-admin-key": document.getElementById("adminKey").value.trim(),
          },
          body: JSON.stringify(body),
        });

        const data = await res.json();
        output.textContent = JSON.stringify(data, null, 2);
        output.className = res.ok && data.success ? "ok" : "err";
      } catch (err) {
        output.textContent = "Request failed: " + err.message;
        output.className = "err";
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = "Run Sync & Dump";
      }
    });
  </script>
</body>
</html>
